<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moja Minimalistyczna Strona</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f8f8;
            color: #222;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #111;
            color: #fff;
            padding: 20px 0;
        }
        main {
            padding: 40px 20px;
        }
        footer {
            background-color: #111;
            color: #aaa;
            padding: 10px 0;
            font-size: 14px;
        }
        a {
            color: #0077cc;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <h1>Witaj na mojej stronie</h1>
    </header>

    <main>
        <h2>O mnie</h2>
        <p>To jest moja minimalistyczna strona internetowa. 
           Możesz tu umieścić dowolne treści: opis, portfolio, kontakt.</p>

        <h2>Kontakt</h2>
        <p>Napisz do mnie: <a href="mailto:twojemail@example.com">twojemail@example.com</a></p>
    </main>

    <footer>
        &copy; 2025 Moja Strona – Wszelkie prawa zastrzeżone
    </footer>
</body>
</html>
